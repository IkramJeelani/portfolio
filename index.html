<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Ikram Jeelani — Engineering Portfolio</title>
  <meta name="description" content="Engineering portfolio of Ikram Jeelani — about, experience, skills, projects and contact." />
  <link rel="icon" type="image/svg+xml" href="favicon.svg" />
  <link rel="stylesheet" href="styles.css" />
</head>
<body data-home>
  <!-- ===== Navigation ===== -->
  <header class="site-header">
    <a href="#home" class="brand" data-brand>IJ</a>
    <nav>
      <a href="#about">About</a>
      <a href="#experience">Experience</a>
      <a href="#skills">Skills</a>
      <a href="#projects">Projects</a>
      <a href="#contact">Contact</a>
    </nav>
  </header>

  <!-- ===== Hero / Name ===== -->
  <section id="home" class="hero">
    <p class="eyebrow" data-role>Engineering Portfolio</p>
    <h1 data-name>Ikram Jeelani</h1>
    <p class="subtitle" data-bio></p>
  </section>

  <!-- ===== About ===== -->
  <section id="about" class="section">
    <h2 class="section-title">About</h2>
    <p class="about-text" id="aboutText"></p>
  </section>

  <!-- ===== Experience ===== -->
  <section id="experience" class="section">
    <h2 class="section-title">Experience</h2>
    <div class="exp-list" id="experienceList"></div>
  </section>

  <!-- ===== Skills ===== -->
  <section id="skills" class="section">
    <h2 class="section-title">Skills</h2>
    <div class="skills-list" id="skillsList"></div>
  </section>

  <!-- ===== Certifications ===== -->
  <section id="certifications" class="section">
    <h2 class="section-title">Certifications</h2>
    <div class="cert-list" id="certList"></div>
  </section>

  <!-- ===== Projects carousel ===== -->
  <section id="projects" class="projects">
    <h2 class="section-title">Projects</h2>

    <div class="carousel" id="carousel">
      <button class="carousel-btn prev" id="prevBtn" aria-label="Previous project">&#8249;</button>
      <div class="carousel-viewport">
        <div class="carousel-track" id="carouselTrack"></div>
      </div>
      <button class="carousel-btn next" id="nextBtn" aria-label="Next project">&#8250;</button>
    </div>

    <div class="carousel-dots" id="carouselDots"></div>
  </section>

  <!-- ===== Contact ===== -->
  <section id="contact" class="section contact">
    <h2 class="section-title">Contact</h2>
    <p>Interested in working together or want to know more? Get in touch.</p>
    <div class="contact-links" id="contactLinks"></div>
  </section>

  <footer class="site-footer">
    <p>&copy; <span data-year></span> <span data-name></span>. Built with HTML, CSS &amp; JavaScript.</p>
  </footer>

  <script src="data.js"></script>
  <script src="branding.js"></script>
  <script src="main.js"></script>
</body>
</html>
