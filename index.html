<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Ikram Jeelani — Engineering Portfolio</title>
  <meta name="description" content="Engineering portfolio of Ikram Jeelani — about, experience, projects, skills, certifications, education and contact." />
  <link rel="icon" type="image/svg+xml" href="favicon.svg" />
  <link rel="stylesheet" href="styles.css" />
</head>
<body data-home>
  <!-- ===== Navigation ===== -->
  <header class="site-header">
    <a href="#home" class="brand" data-brand>IJ</a>
    <nav id="navLinks"></nav>
    <!-- Easter egg: a little character strolls across the nav, right to left.
         Swap assets/luffy.svg for a real walking sprite (GIF/PNG) if you have one. -->
    <div class="nav-walker" aria-hidden="true"><img src="assets/luffy.svg" alt="" /></div>
  </header>

  <!-- ===== Hero / Name ===== -->
  <section id="home" class="hero">
    <p class="eyebrow" data-role>Engineering Portfolio</p>
    <h1 data-name>Ikram Jeelani</h1>
    <p class="subtitle" data-bio></p>
  </section>

  <!-- ===== Sections are injected here by main.js, in the order set in data.js ===== -->
  <main id="sections"></main>

  <footer class="site-footer">
    <p>&copy; <span data-year></span> <span data-name></span>. Built with HTML, CSS &amp; JavaScript.</p>
  </footer>

  <script src="data.js"></script>
  <script src="branding.js"></script>
  <script src="main.js"></script>
</body>
</html>
