<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Ikram Jeelani - Portfolio</title>
  <meta name="description" content="Projects, experience, skills, certifications and education — by Ikram Jeelani." />
  <meta name="author" content="Ikram Jeelani" />
  <meta name="robots" content="index, follow" />
  <!-- Matches SETTINGS.theme's default; branding.js re-syncs it on toggle. -->
  <meta name="theme-color" content="#f6f3ec" />
  <link rel="canonical" href="https://ikramjeelani.github.io/portfolio/" />

  <!-- Open Graph (Facebook, LinkedIn, Slack, iMessage, WhatsApp…)
       og:image is a STATIC file reference — link-preview crawlers fetch raw
       HTML and never run JS, so it can't switch itself based on SETTINGS.theme
       in data.js at request time. assets/og-image-light.png and
       assets/og-image-dark.png are both real screenshots of this same hero,
       one per theme. This file is kept in sync with SETTINGS.theme
       automatically by scripts/sync-og-image.py, which runs as a git
       pre-commit hook (see .githooks/pre-commit) — you shouldn't need to
       touch og:image/twitter:image by hand. -->
  <meta property="og:type" content="website" />
  <meta property="og:site_name" content="Ikram Jeelani" />
  <meta property="og:title" content="Ikram Jeelani - Portfolio" />
  <meta property="og:description" content="Experience, projects, skills, certifications and education — by Ikram Jeelani." />
  <meta property="og:url" content="https://ikramjeelani.github.io/portfolio/" />
  <meta property="og:image" content="https://ikramjeelani.github.io/portfolio/assets/og-image-light.png" />
  <meta property="og:image:width" content="1200" />
  <meta property="og:image:height" content="630" />
  <meta property="og:image:alt" content="Ikram Jeelani - Portfolio" />
  <meta property="og:locale" content="en_US" />

  <!-- Twitter / X card -->
  <meta name="twitter:card" content="summary_large_image" />
  <meta name="twitter:title" content="Ikram Jeelani - Portfolio" />
  <meta name="twitter:description" content="Projects, experience, skills, certifications and education — by Ikram Jeelani." />
  <meta name="twitter:image" content="https://ikramjeelani.github.io/portfolio/assets/og-image-light.png" />

  <script src="data.js"></script>
  <script>try{var t=localStorage.getItem('theme')||((window.SETTINGS||{}).theme==='light'?'light':null);if(t)document.documentElement.setAttribute('data-theme',t);}catch(e){}</script>
  <link rel="icon" type="image/svg+xml" href="favicon.svg" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700&family=Sora:wght@500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="styles.css" />

  <!-- Structured data for rich search results -->
  <script type="application/ld+json">
  {
    "@context": "https://schema.org",
    "@type": "Person",
    "name": "Ikram Jeelani",
    "url": "https://ikramjeelani.github.io/portfolio/",
    "jobTitle": "Mechatronics Engineer",
    "sameAs": [
      "https://github.com/IkramJeelani",
      "https://www.linkedin.com/in/ikramjeelani/"
    ],
    "alumniOf": [
      { "@type": "CollegeOrUniversity", "name": "University of Wollongong in Dubai" },
      { "@type": "CollegeOrUniversity", "name": "Simon Fraser University" }
    ],
    "knowsAbout": ["Embedded Systems", "Robotics", "Firmware", "Control Systems", "PCB Design"]
  }
  </script>
</head>
<body data-home>
  <!-- Lets keyboard users bypass the header controls on every visit -->
  <a class="skip-link" href="#sections">Skip to content</a>

  <!-- ===== Navigation ===== -->
  <header class="site-header intro-item" style="--intro-delay:500ms">
    <a href="#home" class="brand" data-brand>IJ</a>
    <nav id="navLinks" aria-label="Sections"></nav>
  </header>

  <!-- ===== Main content: hero first (so the h1 lives inside the main
       landmark), then the sections main.js injects in data.js order =====
       First-load intro: the name (h1) has no intro-item class, so it's the
       only thing visible at first paint — everything else fades in after it
       in stages via setupHeroIntro() in main.js. -->
  <main id="sections">
    <section id="home" class="hero">
      <div class="hero-visual intro-item" style="--intro-delay:700ms">
        <canvas class="hero-arm" aria-hidden="true"></canvas>
        <p class="hero-arm-hint">click to drop a part</p>
      </div>
      <div class="hero-right">
        <div class="hero-text">
          <p class="eyebrow intro-item" style="--intro-delay:200ms" data-role>Engineering Portfolio</p>
          <h1 data-name>Ikram Jeelani</h1>
          <p class="subtitle intro-item" style="--intro-delay:900ms" data-bio></p>
        </div>
      </div>
    </section>
  </main>

  <footer class="site-footer">
    <p>&copy; <span data-year></span> <span data-name></span>. Built with HTML, CSS &amp; JavaScript.</p>
  </footer>

  <script src="branding.js"></script>
  <script src="main.js"></script>
</body>
</html>
