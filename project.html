<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Project — Ikram Jeelani</title>
  <meta name="description" content="A project by Ikram Jeelani — in-depth write-up with details, tech and links." />
  <meta name="author" content="Ikram Jeelani" />
  <meta name="robots" content="index, follow" />
  <!-- Matches SETTINGS.theme's default; branding.js re-syncs it on toggle. -->
  <meta name="theme-color" content="#f6f3ec" />

  <!-- Sharing cards (project.js refines title/description/url per project).
       og:image is static — crawlers don't run JS, so it can't switch itself
       on SETTINGS.theme at request time. This file is kept in sync with
       SETTINGS.theme automatically by scripts/sync-og-image.py, which runs
       as a git pre-commit hook (see .githooks/pre-commit) — you shouldn't
       need to touch og:image/twitter:image by hand.
       No static <link rel="canonical"> here on purpose: this one template
       is shared by every project, so a static canonical can only ever point
       somewhere WRONG for most of them. Asserting the site root used to do
       exactly that, telling crawlers every project's "real" URL was the
       homepage. project.js creates the canonical tag itself, pointed at the
       actual project (or, for an invalid ?id=, at the page's own URL). -->
  <meta property="og:type" content="article" />
  <meta property="og:site_name" content="Ikram Jeelani" />
  <meta property="og:title" content="Project — Ikram Jeelani" />
  <meta property="og:description" content="An in-depth project write-up by Ikram Jeelani." />
  <meta property="og:url" content="https://ikramjeelani.github.io/portfolio/" />
  <meta property="og:image" content="https://ikramjeelani.github.io/portfolio/assets/og-image-light.png" />
  <meta property="og:image:width" content="1200" />
  <meta property="og:image:height" content="630" />
  <meta property="og:image:alt" content="Ikram Jeelani - Portfolio" />
  <meta name="twitter:card" content="summary_large_image" />
  <meta name="twitter:title" content="Project — Ikram Jeelani" />
  <meta name="twitter:description" content="An in-depth project write-up by Ikram Jeelani." />
  <meta name="twitter:image" content="https://ikramjeelani.github.io/portfolio/assets/og-image-light.png" />

  <script src="data.js"></script>
  <script>try{var t=localStorage.getItem('theme')||((window.SETTINGS||{}).theme==='light'?'light':null);if(t)document.documentElement.setAttribute('data-theme',t);}catch(e){}</script>
  <link rel="icon" type="image/svg+xml" href="favicon.svg" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700&family=Sora:wght@500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <!-- Lets keyboard users bypass the header controls on every visit -->
  <a class="skip-link" href="#projectPage">Skip to content</a>

  <header class="site-header">
    <a href="index.html" class="brand" data-brand>IJ</a>
    <!-- Populated by branding.js from window.SECTIONS (data.js) -->
    <nav aria-label="Sections"></nav>
  </header>

  <main class="project-page" id="projectPage">
    <!-- Filled in by project.js based on the ?id= in the URL -->
  </main>

  <footer class="site-footer">
    <p>&copy; <span data-year></span> <span data-name></span>.</p>
  </footer>

  <!-- One <script> per project folder, each registering into window.PROJECT_DATA — see data.js §6 -->
  <script src="assets/Projects/Model-Winch-for-Foundry/project-data.js"></script>
  <script src="assets/Projects/DC-Motor-Speed-Controller-using-8051-MCU/project-data.js"></script>
  <script src="assets/Projects/Stapler-CAD-Model/project-data.js"></script>
  <script src="branding.js"></script>
  <script src="project.js"></script>
</body>
</html>
