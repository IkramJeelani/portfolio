<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 40 52" width="40" height="52">
  <!-- Simple original straw-hat character. Replace with your own sprite if you like. -->
  <!-- legs -->
  <rect x="14" y="40" width="5" height="10" rx="2" fill="#2b6cb0"/>
  <rect x="21" y="40" width="5" height="10" rx="2" fill="#1e4e80"/>
  <!-- body / red shirt -->
  <rect x="11" y="26" width="18" height="16" rx="5" fill="#d63b3b"/>
  <!-- arms -->
  <rect x="7" y="28" width="5" height="11" rx="2.5" fill="#f3c39b"/>
  <rect x="28" y="28" width="5" height="11" rx="2.5" fill="#f3c39b"/>
  <!-- head -->
  <circle cx="20" cy="18" r="9" fill="#f7cda3"/>
  <!-- smile -->
  <path d="M15 20 q5 4 10 0" stroke="#9c5a32" stroke-width="1.5" fill="none" stroke-linecap="round"/>
  <!-- eyes -->
  <circle cx="17" cy="16" r="1.2" fill="#2a2a2a"/>
  <circle cx="23" cy="16" r="1.2" fill="#2a2a2a"/>
  <!-- straw hat -->
  <ellipse cx="20" cy="11" rx="15" ry="4" fill="#e6c878"/>
  <path d="M12 11 q8 -12 16 0 z" fill="#edd285"/>
  <rect x="9" y="10" width="22" height="2.4" rx="1.2" fill="#c0392b"/>
</svg>
