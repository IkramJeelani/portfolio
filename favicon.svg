<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <!-- Static fallback only: branding.js replaces this at runtime with a
       theme-synced version. Kept identical to the JS output for the default
       (light) theme so the icon doesn't visibly swap after load. -->
  <defs>
    <linearGradient id="g" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#7c3aed"/>
      <stop offset="100%" stop-color="#be185d"/>
    </linearGradient>
  </defs>
  <rect width="64" height="64" rx="14" fill="#f4f3fb"/>
  <text x="32" y="33" dominant-baseline="central" font-family="Segoe UI, Arial, sans-serif" font-size="32" font-weight="800" fill="url(#g)" text-anchor="middle">IJ</text>
</svg>
